<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Scan Viewer</title>
    <!-- Include Papaya CSS & JS from CDN -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/papaya/1.4.0/papaya.css" />
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/papaya/1.4.0/papaya.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0b;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Papaya Viewer Container Styling */
        .papaya {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Papaya Viewer Element -->
    <div class="papaya" data-params="params"></div>

    <script type="text/javascript">
        // Configure Papaya to load your .nrrd file from the same GitHub repository
        var params = [];
        params["images"] = ["output_image.nrrd"]; 
    </script>

</body>
</html>
